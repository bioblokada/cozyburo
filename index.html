<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Cozy Buro — интерьеры с характером">
<meta property="og:description" content="Дизайн интерьеров ресторанов и баров. Концепция, локация, дизайн. Москва.">
<meta property="og:image" content="https://cozyburo.ru/img/lanterns.jpg">
<meta property="og:url" content="https://cozyburo.ru/">
<meta name="theme-color" content="#121010">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27none%27 stroke=%27%23F1ECE4%27 stroke-width=%273%27/%3E%3Ctext x=%2732%27 y=%2729%27 text-anchor=%27middle%27 font-family=%27Arial%27 font-size=%2713%27 font-weight=%27700%27 fill=%27%23F1ECE4%27%3ECOZY%3C/text%3E%3Ctext x=%2732%27 y=%2745%27 text-anchor=%27middle%27 font-family=%27Arial%27 font-size=%2713%27 font-weight=%27700%27 fill=%27%23F1ECE4%27%3EBURO%3C/text%3E%3C/svg%3E">
<title>Cozy Buro</title>
<meta name="description" content="Cozy Buro — интерьеры ресторанов и баров с характером. Концепция, локация, дизайн. Москва.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: one full-bleed photo (random per visit, slow drift), wordmark centered on it, contacts pinned to the bottom edge. */
:root{
  --ink:#121010;
  --paper:#F1ECE4;
  --haze:rgba(10,8,6,.34);
  --font-mark:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --font-line:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-mark);-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
.slide{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.8s ease}
.slide.on{opacity:1;animation:drift 26s ease-in-out forwards}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.09) translate(-1.2%,-.8%)}}
.veil{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 60% at 50% 50%,rgba(0,0,0,.22),transparent 70%),
  linear-gradient(to bottom,rgba(0,0,0,.28),transparent 30%,transparent 65%,rgba(0,0,0,.55));}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;pointer-events:none}

.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 16px}
.mark{font-weight:500;font-size:clamp(34px,7vw,88px);letter-spacing:.42em;text-indent:.42em;line-height:1.08;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.mark span{display:block}
.line{font-family:var(--font-line);font-style:italic;font-weight:400;font-size:clamp(19px,2.4vw,30px);letter-spacing:.02em;margin-top:clamp(18px,3vw,34px);opacity:.92;text-shadow:0 1px 20px rgba(0,0,0,.45)}
.rule{width:44px;height:1px;background:currentColor;opacity:.55;margin:clamp(20px,3vw,34px) auto 0}
.soon{font-size:11px;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;margin-top:18px;opacity:.75}

.foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:0 clamp(18px,3vw,40px) calc(22px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.26em;text-transform:uppercase}
.foot a{color:inherit;text-decoration:none;opacity:.85;padding:6px 0;border-bottom:1px solid transparent;transition:border-color .25s,opacity .25s}
.foot a:hover,.foot a:focus-visible{opacity:1;border-color:currentColor;outline:none}
.foot .l,.foot .r{display:flex;gap:26px;flex-wrap:wrap}
.foot .r{justify-content:flex-end;text-align:right}
.foot .muted{opacity:.6}
@media(max-width:560px){.foot{flex-direction:column;align-items:center;text-align:center;gap:10px}.foot .r{justify-content:center;text-align:center}.foot .l,.foot .r{gap:18px}}
@media(prefers-reduced-motion:reduce){.slide.on{animation:none}.slide{transition:none}}
.fade{animation:in 1.4s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

</head>
<body>
<div class="stage" aria-hidden="true">
  <div class="slide" id="s0"></div>
  <div class="slide" id="s1"></div>
  <div class="veil"></div>
  <canvas class="grain" id="grain"></canvas>
</div>

<main class="center">
  <div class="fade">
    <h1 class="mark"><span>COZY</span><span>BURO</span></h1>
    <p class="line">Интерьеры с&nbsp;характером</p>
    <div class="rule"></div>
    <p class="soon">Сайт скоро</p>
  </div>
</main>

<footer class="foot fade">
  <div class="l">
    <a href="https://www.instagram.com/cozyburo/" target="_blank" rel="noopener">Instagram</a>
    <a href="https://t.me/lenadrumlevich" target="_blank" rel="noopener">Telegram</a>
  </div>
  <div class="r">
    <span class="muted">Restaurant &amp; Bar Design · Moscow</span>
  </div>
</footer>

<script>
(function(){
  var photos=['img/lanterns','img/bar','img/lounge'];
  var mobile=Math.min(innerWidth,innerHeight)<700;
  function url(p){return p+(mobile?'-m':'')+'.jpg';}
  var slides=[document.getElementById('s0'),document.getElementById('s1')],cur=0;
  var i=Math.floor(Math.random()*photos.length);
  function show(n){
    var next=(cur+1)%2,im=new Image();
    im.onload=function(){
      slides[next].style.backgroundImage='url("'+im.src+'")';
      slides[cur].classList.remove('on'); void slides[next].offsetWidth; slides[next].classList.add('on'); cur=next;
    };
    im.src=url(photos[n]); i=n;
  }
  show(i);
  setInterval(function(){show((i+1)%photos.length)},12000);

  // film grain
  var c=document.getElementById('grain'),g=c.getContext('2d');
  function grain(){c.width=240;c.height=240;var id=g.createImageData(240,240),d=id.data;
    for(var p=0;p<d.length;p+=4){var v=Math.random()*255;d[p]=d[p+1]=d[p+2]=v;d[p+3]=255;}
    g.putImageData(id,0,0);}
  grain();c.style.width='100%';c.style.height='100%';c.style.imageRendering='pixelated';
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){setInterval(grain,120);}
})();
</script>

</body>
</html>
